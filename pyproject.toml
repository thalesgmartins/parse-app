[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cnis-parse-app"
version = "0.3.0"
description = "SAAS para extrair dados de documentos CNIS."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pdfplumber",
    "fastapi",
    "jinja2",
    "uvicorn",
    "python-dotenv",
    "python-multipart",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "bcrypt>=4.0.0",
    "pyjwt>=2.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-asyncio", "pre-commit", "httpx2>=2.13.1"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]  # erros, imports, upgrades, bugbear, simplify

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
