[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parse_backend"
version = "0.0.1"
description = "Conversão de documentos CNIS em tabela."
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
    "pdfplumber",
    "fastapi",
    "supabase",
    "uvicorn",
    "python-dotenv",
    "python-multipart"
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]

[tool.setuptools.packages.find]
where = ["src"]