name: Publicar imagem no GHCR

on:
  push:
    tags:
      - "v*"          # dispara em tags como v1.0.0, v1.2.3
  workflow_dispatch:  # permite rodar manualmente pela UI

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # QEMU permite emular ARM (Raspberry Pi) a partir do runner x86
      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # token automático, sem PAT

      # Gera tags/labels automaticamente a partir da tag do git
      - name: Extrair metadados (tags e labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}       # v1.2.3 -> 1.2.3
            type=semver,pattern={{major}}.{{minor}} # v1.2.3 -> 1.2
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build e push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Cria a Release no GitHub - SO quando o disparo foi uma tag (nao no run manual)
      #- name: Criar Release
      #  if: startsWith(github.ref, 'refs/tags/')
