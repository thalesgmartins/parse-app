<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nitly - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-8">

    <div class="max-w-3xl mx-auto bg-white p-8 rounded-xl shadow-sm border border-slate-200">
        <h1 class="text-2xl font-bold text-slate-900 mb-2">Processar Documento CNIS</h1>
        <p class="text-slate-500 mb-6">Faça o upload do extrato em PDF para extrair as contribuições.</p>

        <form hx-post="/cnis/extrair-html" 
              hx-encoding="multipart/form-data" 
              hx-target="#resultado-aqui"
              class="flex items-center gap-4">
            
            <input type="file" name="arquivo" accept="application/pdf" required
                   class="block w-full text-sm text-slate-500
                          file:mr-4 file:py-2 file:px-4
                          file:rounded-md file:border-0
                          file:text-sm file:font-semibold
                          file:bg-blue-50 file:text-blue-700
                          hover:file:bg-blue-100 cursor-pointer">
            
            <button type="submit" 
                    class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-md transition">
                Extrair
            </button>
        </form>

        <div id="resultado-aqui" class="mt-8"></div>
    </div>

</body>
</html>
