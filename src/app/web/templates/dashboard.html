<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nitly - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-8">

    <div class="max-w-3xl mx-auto bg-white p-8 rounded-xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-slate-900">Dashboard do Escritório</h1>
            <span class="text-sm text-slate-500">Logado como: {{ usuario_email }}</span>
        </div>

        <div class="bg-slate-50 p-4 rounded-md border border-slate-200 mb-8">
            <h2 class="text-sm font-semibold text-slate-700 mb-3">1. Cadastrar Novo Cliente</h2>
            <form action="/cnis/clientes" method="POST" class="flex gap-4">
                <input type="text" name="nome" placeholder="Nome Completo" required class="flex-1 px-3 py-2 border rounded-md text-sm">
                <input type="text" name="cpf" placeholder="CPF (Opcional)" class="w-1/3 px-3 py-2 border rounded-md text-sm">
                <button type="submit" class="bg-slate-800 text-white px-4 py-2 rounded-md text-sm hover:bg-slate-700">Salvar Cliente</button>
            </form>
        </div>

        <div class="bg-white p-4 rounded-md border border-slate-200">
            <h2 class="text-sm font-semibold text-slate-700 mb-3">2. Processar CNIS do Cliente</h2>
            
            <form hx-post="/cnis/extrair-html" hx-encoding="multipart/form-data" hx-target="#resultado-aqui" class="flex items-center gap-4">
                
                <select name="cliente_id" required class="w-1/3 px-3 py-2 text-sm border border-slate-300 rounded-md bg-white">
                    <option value="">Selecione o Cliente...</option>
                    {% for cliente in clientes %}
                        <option value="{{ cliente.id }}">{{ cliente.nome }}</option>
                    {% endfor %}
                </select>
                
                <input type="file" name="arquivo" accept="application/pdf" required class="flex-1 text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
                
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-md transition">Extrair</button>
            </form>
        </div>

        <div id="resultado-aqui" class="mt-8"></div>
    </div>

</body>
</html>
